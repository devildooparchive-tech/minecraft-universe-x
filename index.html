<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Universe X — v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game-canvas { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); color: #fff; cursor: pointer;
      font-family: system-ui, sans-serif; gap: 12px; user-select: none;
    }
    #overlay h1 { font-size: 2.2rem; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
    #overlay p { opacity: .85; font-size: .95rem; }
    #hud {
      position: absolute; top: 10px; left: 10px; color: #fff;
      font-family: monospace; font-size: 12px; text-shadow: 0 1px 3px #000;
      pointer-events: none; white-space: pre;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 20px; text-shadow: 0 0 3px #000; pointer-events: none;
    }
    #save-status {
      position: absolute; bottom: 10px; right: 10px; color: #9f9;
      font-family: monospace; font-size: 12px; text-shadow: 0 1px 3px #000;
      opacity: 0; transition: opacity .5s; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="overlay">
    <h1>Minecraft Universe X</h1>
    <p>اضغط للعب — WASD للحركة · الماوس للنظر · Space للقفز · F5 يحفظ</p>
  </div>
  <div id="hud"></div>
  <div id="crosshair">+</div>
  <div id="save-status">✓ تم الحفظ</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
